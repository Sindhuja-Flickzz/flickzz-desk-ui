<div class="confirmation-dialog">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content class="dialog-content">
    <p>{{ data.message }}</p>
    <div *ngIf="data.includeRemarks" class="remarks-field">
      <label for="remarks">{{ data.remarksLabel }}</label>
      <textarea
        id="remarks"
        rows="4"
        [(ngModel)]="remarks"
        [attr.placeholder]="data.remarksPlaceholder"
      ></textarea>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button *ngIf="data.showCancel" (click)="onCancel()">{{ data.cancelText }}</button>
    <button mat-raised-button color="primary" (click)="onConfirm()">{{ data.confirmText }}</button>
  </mat-dialog-actions>
</div>
