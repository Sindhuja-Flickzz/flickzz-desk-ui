<div class="priority-page">
  <div class="create-panel">
    <div class="page-header">
      <h2>{{ pageTitle }}</h2>
      <button type="button" class="save-btn header-back" (click)="backToPrevious()"><mat-icon>arrow_back</mat-icon> Back</button>
    </div>
    <div class="context-banner">{{ contextLabel }}</div>

    <form [formGroup]="priorityForm" (ngSubmit)="onSave()" aria-label="Priority form">
      <div *ngIf="submitError" class="error-text">✗ {{ submitError }}</div>
      <div *ngIf="submitSuccess" class="success-text">✓ {{ submitSuccess }}</div>

      <div class="form-row">
        <div class="field">
          <label for="ticketType">Ticket Type</label>
          <select id="ticketType" formControlName="ticketType">
            <option value="" disabled>Select ticket type</option>
            <option [value]="1">Incident</option>
            <option [value]="2">Service Request</option>
            <option [value]="3">Change Request</option>
          </select>
          <span *ngIf="formError.ticketType" class="error-text">{{ formError.ticketType }}</span>
        </div>

        <div class="field">
          <label for="level">Level</label>
          <input id="level"
            type="number"
            formControlName="level"
            min="1"
            step="1"
            placeholder="Enter level"
            inputmode="numeric"
            (input)="onLevelInput($event)"
          />
          <span *ngIf="formError.level" class="error-text">{{ formError.level }}</span>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="code">Code</label>
          <input id="code" type="text" formControlName="code" placeholder="Enter code" />
          <span *ngIf="formError.code" class="error-text">{{ formError.code }}</span>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <input id="description" formControlName="description" placeholder="Enter description"/>
          <span *ngIf="formError.description" class="error-text">{{ formError.description }}</span>
        </div>
      </div>

      <div class="actions">
        <button type="submit" [disabled]="isSubmitting" class="save-btn">{{ isSubmitting ? 'Saving...' : 'Save' }}</button>
        <button type="button" class="reset-btn" (click)="resetForm()">Reset</button>
      </div>
    </form>
  </div>
</div>
